name: Deploy Functions

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: 'Azure Resource Group name'
        required: true
        default: 'rg-lb-lab'
  push:
    branches: [main]
    paths: ['src/**']

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ github.event.inputs.resourceGroup || 'rg-lb-lab' }}
  PYTHON_VERSION: '3.11'

jobs:
  # ------------------------------------------------------------------
  # Resolve the dynamically-generated function app names from the
  # infrastructure deployment outputs.
  # ------------------------------------------------------------------
  resolve-names:
    name: Resolve Function App names
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      funcAppAName: ${{ steps.names.outputs.funcAppAName }}
      funcAppBName: ${{ steps.names.outputs.funcAppBName }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get function app names from deployment outputs
        id: names
        run: |
          FUNC_A=$(az deployment group show \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name main \
            --query 'properties.outputs.functionAppAName.value' \
            --output tsv)
          FUNC_B=$(az deployment group show \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name main \
            --query 'properties.outputs.functionAppBName.value' \
            --output tsv)
          echo "funcAppAName=$FUNC_A" >> "$GITHUB_OUTPUT"
          echo "funcAppBName=$FUNC_B" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Deploy API A
  # ------------------------------------------------------------------
  deploy-api-a:
    name: Deploy apiA
    runs-on: ubuntu-latest
    needs: resolve-names
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd src/apiA
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ needs.resolve-names.outputs.funcAppAName }}
          package: src/apiA

  # ------------------------------------------------------------------
  # Deploy API B
  # ------------------------------------------------------------------
  deploy-api-b:
    name: Deploy apiB
    runs-on: ubuntu-latest
    needs: resolve-names
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd src/apiB
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ needs.resolve-names.outputs.funcAppBName }}
          package: src/apiB
